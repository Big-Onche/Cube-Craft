////////////////////////////////////////////////
//
// sky shaders
//
////////////////////////////////////////////////

shader 0 "skybox" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 skymatrix;
    uniform float ldrscale;
    varying vec4 colorscale;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;
        texcoord0 = vtexcoord0; 
        colorscale = vec4(ldrscale * vcolor.rgb, vcolor.a);
    }
] [
    uniform sampler2D tex0;
    varying vec4 colorscale;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        fragcolor = colorscale * color;
    }
]

shader 0 "skyboxoverbright" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 skymatrix;
    uniform float ldrscale;
    varying vec4 colorscale;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;
        texcoord0 = vtexcoord0; 
        colorscale = vec4(ldrscale * vcolor.rgb, vcolor.a);
    }
] [
    uniform sampler2D tex0;
    uniform vec3 overbrightparams;
    uniform float ldrscale;
    varying vec4 colorscale;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        float lum = dot(vec3(@lumweights), color.rgb);
        float overbright = mix(overbrightparams.x, overbrightparams.y, clamp(lum - overbrightparams.z, 0.0, 1.0));
        color.rgb *= overbright;
        fragcolor = colorscale * color;
    }
]

shader 0 "atmosphere" [
    attribute vec4 vvertex;
    uniform mat4 sunmatrix;
    varying vec3 camvec;
    void main(void)
    {
        gl_Position = vvertex;

        vec4 p = sunmatrix * vvertex;
        camvec = p.xyz / p.w;
    }
] [
    uniform vec4 sunlight;
    uniform vec3 sundir;
    uniform vec3 sundiskcolor;
    uniform vec2 sundiskparams;
    uniform vec4 atmosphereparams;
    uniform vec2 ozoneparams;
    uniform vec3 mieparams;
    uniform vec3 betarayleigh, betamie, betaozone;
    uniform vec2 hdrgamma;
    varying vec3 camvec;
    fragdata(0) vec4 fragcolor;

    float sphereexit(vec3 origin, vec3 direction, float radius)
    {
        float b = dot(origin, direction);
        float h = b*b - dot(origin, origin) + radius*radius;
        return h > 0.0 ? max(-b + sqrt(h), 0.0) : 0.0;
    }

    float sphereentry(vec3 origin, vec3 direction, float radius)
    {
        float b = dot(origin, direction);
        float h = b*b - dot(origin, origin) + radius*radius;
        return h > 0.0 ? -b - sqrt(h) : -1.0;
    }

    vec3 atmosphericdensity(vec3 position)
    {
        float altitude = max(length(position) - 1.0, 0.0);
        float rayleigh = exp(-altitude / max(atmosphereparams.z, 1e-7));
        float mie = exp(-altitude / max(atmosphereparams.w, 1e-7));
        float ozone = max(1.0 - abs(altitude - ozoneparams.x) / max(ozoneparams.y, 1e-7), 0.0);
        return vec3(rayleigh, mie, ozone);
    }

    vec3 sunlightdepth(vec3 origin)
    {
        // A positive ground intersection means this sample is in the planet's shadow.
        if(sphereentry(origin, sundir, 1.0) > 1e-5) return vec3(-1.0);

        float raylength = sphereexit(origin, sundir, atmosphereparams.y);
        vec3 opticaldepth = vec3(0.0);
        for(int i = 0; i < 6; i++)
        {
            float beginfraction = float(i) / 6.0;
            float endfraction = float(i + 1) / 6.0;
            float segmentbegin = raylength * beginfraction*beginfraction*beginfraction;
            float segmentend = raylength * endfraction*endfraction*endfraction;
            float segmentlength = segmentend - segmentbegin;
            vec3 samplepos = origin + sundir * (0.5 * (segmentbegin + segmentend));
            opticaldepth += atmosphericdensity(samplepos) * segmentlength;
        }
        return opticaldepth * atmosphereparams.x;
    }

    void main(void)
    {
        vec3 camdir = normalize(camvec);
        float diskcostheta = dot(camdir, sundir);

        // sun disk
        float edgeoffset = max(1.0 - (1.0 - max(diskcostheta, 0.0)*diskcostheta)*sundiskparams.x, 0.0);
        // limb darken with distance to edge
        vec3 limbdarken = pow(vec3(edgeoffset), vec3(0.397, 0.503, 0.64));
        // lighten edges for corona, but limit it to not interfere with limb darkening
        float corona = min(edgeoffset * sundiskparams.y, 1.0);
        corona = max(0.1725 / (1.15 - corona * corona) - 0.15, 0.0);
        // Apply limb darkening and corona to the atmosphere-extinguished solar disk.
        vec3 sundisk = sundiskcolor * limbdarken * corona;

        // Integrate view and sun optical depths through the spherical atmosphere.
        // Cubic sample spacing concentrates work in the dense lower atmosphere.
        // The engine can expose sky below the mathematical horizon behind distant
        // geometry. Clamp those scattering rays to the optical horizon instead of
        // letting them immediately hit the planet and produce a black band.
        vec3 scatterdir = normalize(vec3(camdir.xy, max(camdir.z, 1e-4)));
        float costheta = dot(scatterdir, sundir);
        vec3 camera = vec3(0.0, 0.0, 1.000001);
        float raylength = sphereexit(camera, scatterdir, atmosphereparams.y);

        vec3 viewdepth = vec3(0.0);
        vec3 rayleighsum = vec3(0.0);
        vec3 miesum = vec3(0.0);
        for(int i = 0; i < 8; i++)
        {
            float beginfraction = float(i) / 8.0;
            float endfraction = float(i + 1) / 8.0;
            float segmentbegin = raylength * beginfraction*beginfraction*beginfraction;
            float segmentend = raylength * endfraction*endfraction*endfraction;
            float segmentlength = segmentend - segmentbegin;
            vec3 samplepos = camera + scatterdir * (0.5 * (segmentbegin + segmentend));
            vec3 density = atmosphericdensity(samplepos);
            vec3 segmentdepth = density * (segmentlength * atmosphereparams.x);
            vec3 lightdepth = sunlightdepth(samplepos);
            if(lightdepth.x >= 0.0)
            {
                vec3 totaldepth = viewdepth + 0.5*segmentdepth + lightdepth;
                vec3 extinction = exp2(-min(betarayleigh*totaldepth.x +
                                            betamie*totaldepth.y +
                                            betaozone*totaldepth.z, vec3(127.0)));
                rayleighsum += extinction * segmentdepth.x;
                miesum += extinction * segmentdepth.y;
            }
            viewdepth += segmentdepth;
        }

        // Calculate wavelength-dependent Rayleigh and Mie in-scattering.
        float rphase = (1.5 + 0.5*costheta*costheta) * (3.0 / (16.0 * 3.14159265));
        float mphase = inversesqrt(mieparams.x + mieparams.y*min(costheta, mieparams.z));
        vec3 inscatter = sunlight.rgb *
            (betarayleigh * rayleighsum * rphase +
             betamie * miesum * (mphase * mphase * mphase)) + sundisk;

        @(hdrgammaencode inscatter)

        fragcolor = vec4(inscatter, sunlight.a);
    }
]

shader 0 "skyfog" [
    attribute vec4 vvertex, vcolor;
    uniform mat4 skymatrix;
    uniform float ldrscale;
    varying vec4 color;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;
        color = vec4(ldrscale * vcolor.rgb, vcolor.a);
    }
] [
    uniform sampler2D tex0;
    varying vec4 color;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor =
            //:variantoverride vec4(color.rgb, color.a * color.a)
            color
            ;
    }
]
