craftrecipe "sticks" [
    recipetype "shaped"
    recipeoutput "stick" 4
    recipepattern [
        "P"
        "P"
    ]
    recipeingredient "P" "#planks"
]

craftrecipe "torches" [
    recipetype "shaped"
