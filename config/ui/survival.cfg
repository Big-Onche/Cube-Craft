///////////////////////////////////////////////////////////////////////////////
//  Survival inventory and hotbar                                            //
///////////////////////////////////////////////////////////////////////////////

UI_survival_drag_slot = -1

UI_survival_item_preview = [
    UI_creative_item_preview $arg1 $arg2 [
        doargs $arg3
    ]
]

UI_survival_slot = [
    local item
    local count
    item = (getsurvivalinventoryitem $arg1)
    count = (getsurvivalinventorycount $arg1)
    uidragsource $arg2 $arg2 [
        uicolor 0xD0222222 $arg2 $arg2
        if (&& (< $arg1 9) (= $arg1 (getcreativehotbarselected))) [
            uioutline 0xFFE7B94A
        ] [
            uioutline 0xFF777777
        ]
        uiclamp* 1 1 1 1

        if (>= $item 0) [
            UI_survival_item_preview $item (*f $arg2 0.82) [
                uialign 0 0
            ]
            uifill $arg2 $arg2 [
                uialign 1 1
                uispace 0.004 0.002 [
                    uitext $count 0.38
                ]
            ]
        ]

        if (< $arg1 9) [
            uifill $arg2 $arg2 [
                uialign -1 -1
                uispace 0.004 0.002 [
                    uitext (+ $arg1 1) 0.40
                ]
            ]
        ]

        uipress [
            if (< $arg1 9) [creativehotbarselect $arg1]
            if (>= $item 0) [UI_survival_drag_slot = $arg1]
        ]
        uidrop [
            if (>= $UI_survival_drag_slot 0) [
                survivalinventoryswap $UI_survival_drag_slot $arg1
                if (< $arg1 9) [creativehotbarselect $arg1]
                UI_survival_drag_slot = -1
            ]
        ]
        uihold [
            uioutline 0xFFFFFFFF
            uiclamp- 1 1 1 1
        ]
        uihover [
            uioutline 0xFFC0C0C0
            uiclamp- 1 1 1 1
        ]
    ]
]

UI_survival_hotbar = [
    uihlist 0.005 [
        loop i 9 [
            UI_survival_slot $i $arg1
        ]
    ]
]

UI_survival_locked_slot = [
    uifill $arg1 $arg1 [
        uicolor 0xE0181818 $arg1 $arg1
        uioutline 0xFF444444
        uiclamp* 1 1 1 1
        uitext "X" 0.52
    ]
]

newui "survival_hotbar" [
    uiallowinput (&& (survivalactive) (uivisible "survival_inventory"))
    uieschide 0
    if (|| $mainmenu $hidehud $editing (! (survivalactive))) [] [
        uialign 0 1
        uispace 0 0.018 [
            UI_survival_hotbar 0.064
        ]
    ]
]

newui "survival_drag_preview" [
    uiallowinput 0
    uieschide 0
    if (&& (uivisible "survival_inventory") (>= $UI_survival_drag_slot 0)) [
        uialign -1 -1
        local item
        item = (getsurvivalinventoryitem $UI_survival_drag_slot)
        if (uidragreleased) [
            if (>=f (uidragreturnprogress 220) 1.0) [
                UI_survival_drag_slot = -1
                uidragfinish
            ] [
                uioffset (-f (uidragreturnx 220) 0.029) (-f (uidragreturny 220) 0.029) [
                    UI_survival_item_preview $item 0.058 [
                        uioutline 0xFFFFFFFF
                        uiclamp- 1 1 1 1
                    ]
                ]
            ]
        ] [
            uioffset (-f (uicursorx 0.029) 0.029) (-f (uicursory 0.029) 0.029) [
                UI_survival_item_preview $item 0.058 [
                    uioutline 0xFFFFFFFF
                    uiclamp- 1 1 1 1
                ]
            ]
        ]
    ]
]

UImenu "survival_inventory" [
    if (! (survivalactive)) [
        hideui "survival_inventory"
    ] [
        uivlist 0.014 [
            uivlist 0.004 [
                uitext "Survival inventory" 0.75
                uigrid 9 0.005 0.005 [
                    loop i 18 [
                        UI_survival_locked_slot 0.064
                    ]
                ]
                uihlist 0.005 [
                    loop i 9 [
                        UI_survival_slot (+ $i 9) 0.064
                    ]
                ]
            ]
            uiline $c_line
            UI_survival_hotbar 0.064
        ]
    ]
] [
    UI_survival_drag_slot = -1
    showui "survival_drag_preview"
] [
    UI_survival_drag_slot = -1
    hideui "survival_drag_preview"
] [] "Inventory"
