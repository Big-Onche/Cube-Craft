///////////////////////////////////////////////////////////////////////////////
//  Survival inventory and hotbar                                            //
///////////////////////////////////////////////////////////////////////////////

UI_survival_item_preview = [
    UI_creative_item_preview $arg1 $arg2 [
        doargs $arg3
    ]
]

UI_survival_slot = [
    local item
    local count
    item = (getsurvivalinventoryitem $arg1)
    count = (getsurvivalinventorycount $arg1)
    uitarget $arg2 $arg2 [
        uicolor 0xD0222222 $arg2 $arg2
        if (&& (< $arg1 9) (= $arg1 (getcreativehotbarselected))) [
            uioutline 0xFFE7B94A
        ] [
            uioutline 0xFF777777
        ]
        uiclamp* 1 1 1 1

        if (>= $item 0) [
            UI_survival_item_preview $item (*f $arg2 0.82) [
                uialign 0 0
            ]
            uifill $arg2 $arg2 [
                uialign 1 1
                uispace 0.004 0.002 [
                    uitext $count 0.55
                    uialign 1 1
                ]
            ]
        ]

        uipress [survivalinventoryclick $arg1 0]
        uiescpress [survivalinventoryclick $arg1 1]
        uihold [
            uioutline 0xFFFFFFFF
            uiclamp- 1 1 1 1
        ]
        uieschold [
            uioutline 0xFFFFFFFF
            uiclamp- 1 1 1 1
        ]
        uihover [
            uioutline 0xFFC0C0C0
            uiclamp- 1 1 1 1
        ]
    ]
]

UI_crafting_slot = [
    local item
    local count
    item = (getcraftinggriditem $arg1)
    count = (getcraftinggridcount $arg1)
    uitarget $arg2 $arg2 [
        uicolor 0xD0222222 $arg2 $arg2
        uioutline 0xFF777777
        uiclamp* 1 1 1 1
        if (>= $item 0) [
            UI_survival_item_preview $item (*f $arg2 0.82) [uialign 0 0]
            uifill $arg2 $arg2 [
                uialign 1 1
                uispace 0.004 0.002 [uitext $count 0.38]
            ]
        ]
        uipress [craftinggridclick $arg1 0]
        uiescpress [craftinggridclick $arg1 1]
        uihold [uioutline 0xFFFFFFFF; uiclamp- 1 1 1 1]
        uieschold [uioutline 0xFFFFFFFF; uiclamp- 1 1 1 1]
        uihover [uioutline 0xFFC0C0C0; uiclamp- 1 1 1 1]
    ]
]

UI_crafting_output = [
    local item
    local count
    item = (getcraftingoutputitem)
    count = (getcraftingoutputcount)
    uitarget $arg1 $arg1 [
        uicolor 0xD0303020 $arg1 $arg1
        uioutline 0xFFE7B94A
        uiclamp* 1 1 1 1
        if (>= $item 0) [
            UI_survival_item_preview $item (*f $arg1 0.82) [uialign 0 0]
            uifill $arg1 $arg1 [
                uialign 1 1
                uispace 0.004 0.002 [uitext $count 0.38]
            ]
            uipress [craftingtakeoutputcursor 0]
            uiescpress [craftingtakeoutputcursor 1]
        ]
        uihover [uioutline 0xFFFFFFFF; uiclamp- 1 1 1 1]
    ]
]

UI_crafting_grid = [
    uihlist 0.014 [
        uigrid $arg1 0.005 0.005 [
            loop i (* $arg1 $arg1) [UI_crafting_slot $i $arg2]
        ]
        uitext "→" 0.7
        UI_crafting_output $arg2
    ]
]

UI_survival_hotbar = [
    uihlist 0.005 [
        loop i 9 [
            UI_survival_slot $i $arg1
        ]
    ]
]

UI_survival_locked_slot = [
    uifill $arg1 $arg1 [
        uicolor 0xE0181818 $arg1 $arg1
        uioutline 0xFF444444
        uiclamp* 1 1 1 1
        uitext "X" 0.52
    ]
]

newui "survival_hotbar" [
    uiallowinput (&& (survivalactive) (uivisible "survival_inventory"))
    uieschide 0
    if (|| $mainmenu $hidehud $editing (! (survivalactive))) [] [
        uialign 0 1
        uispace 0 0.018 [
            UI_survival_hotbar 0.064
        ]
    ]
]

newui "survival_drag_preview" [
    uiallowinput 0
    uieschide 0
    if (&& (|| (uivisible "survival_inventory") (uivisible "crafting_table")) (>= (getinventorycursoritem) 0)) [
        uialign -1 -1
        local item
        local count
        item = (getinventorycursoritem)
        count = (getinventorycursorcount)
        uioffset (-f (uicursorx 0.029) 0.029) (-f (uicursory 0.029) 0.029) [
            UI_survival_item_preview $item 0.058 [
                uioutline 0xFFFFFFFF
                uiclamp- 1 1 1 1
                uifill 0.058 0.058 [
                    uialign 1 1
                    uispace 0.004 0.002 [uitext $count 0.38]
                ]
            ]
        ]
    ]
]

UImenu "survival_inventory" [
    uieschide 0
    if (! (survivalactive)) [
        hideui "survival_inventory"
    ] [
        uivlist 0.014 [
            UI_crafting_grid 2 0.064
            uiline $c_line
            uivlist 0.004 [
                uitext "Survival inventory" 0.75
                uigrid 9 0.005 0.005 [
                    loop i 18 [
                        UI_survival_locked_slot 0.064
                    ]
                ]
                uihlist 0.005 [
                    loop i 9 [
                        UI_survival_slot (+ $i 9) 0.064
                    ]
                ]
            ]
            uiline $c_line
            UI_survival_hotbar 0.064
        ]
    ]
] [
    opencraftinginventory
    showui "survival_drag_preview"
] [
    hideui "survival_drag_preview"
] [] "Inventory"

UImenu "crafting_table" [
    uieschide 0
    if (! (survivalactive)) [
        hideui "crafting_table"
    ] [
        uivlist 0.014 [
            uitext "Crafting Table" 0.75
            UI_crafting_grid 3 0.064
            uiline $c_line
            uihlist 0.005 [
                loop i 9 [UI_survival_slot (+ $i 9) 0.064]
            ]
            UI_survival_hotbar 0.064
        ]
    ]
] [
    showui "survival_drag_preview"
] [
    hideui "survival_drag_preview"
] [] "Crafting Table"
