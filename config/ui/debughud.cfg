///////////////////////////////////////////////////////////////////////////////
//  In-game Debug HUD                                                        //
///////////////////////////////////////////////////////////////////////////////
tectonicdebugbar = [
    uihlist 0.006 [
        uitext $arg1 0.45
        uifill 0.14 0.012 [
            uicolor 0x60303030 0.14 0.012
            uicolor $arg3 (*f 0.14 $arg2) 0.012 [uialign -1 0]
            uioutline $c_line
        ]
        uitext $arg2 0.42
    ]
]

newui "debughud" [
    uiallowinput 0
    if (|| $mainmenu $hidehud $editing) [] [
        uialign -1 -1
        uispace 0.01 0.01 [
            uicolor $c_menu_a 0 0 [
                uispace $UIwindow_padding $UIwindow_padding [
                    uivlist 0.003 [
                        uitext "^f8Cube Craft Debug ^f7[F2]" 0.6
                        uiline $c_line
                        uitext (format "Absolute camera: X %1  Y %2  Z %3" (getdebugcamx) (getdebugcamy) (getdebugcamz)) 0.52
                        uitext (format "Player speed: %1 m/s" (getdebugplayerspeed)) 0.52
                        uitext (format "Camera chunk: X %1  Y %2" (getdebugchunkx) (getdebugchunky)) 0.52
                        uitext (format "Rendered chunks: %1 / %2" (getdebugrenderedfull) (getdebugtargetchunks)) 0.52
                        uitext (format "Scatter objects drawn: %1" (getworldscatterdrawn)) 0.52
                        uitext (format "Chunk loading queue: %1" (getdebugloadingqueue)) 0.52
                        uitext (format "Chunk generation queue: %1" (getdebuggenerationqueue)) 0.52
                        uiline $c_line
                        uitext "^f8Tectonic fields at camera" 0.50
                        tectonicdebugbar "Raw activity" (getdebugtectonicactivity) 0xFFE0A040
                        tectonicdebugbar "Land uplift" (getdebugtectonicuplift) 0xFFE06040
                        tectonicdebugbar "Ocean trench" (getdebugtectonictrench) 0xFF4080E0
                        tectonicdebugbar "Cave expansion" (getdebugtectoniccave) 0xFFA060D0
                        uialign* -1 0
                    ]
                ]
                uioutline $c_line
                uiclamp- 1 1 1 1
            ]
        ]
    ]
]
