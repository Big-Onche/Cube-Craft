///////////////////////////////////////////////////////////////////////////////
//  In-game Debug HUD                                                        //
///////////////////////////////////////////////////////////////////////////////
newui "debughud" [
    uiallowinput 0
    if (|| $mainmenu $hidehud $editing) [] [
        uialign -1 -1
        uispace 0.01 0.01 [
            uicolor $c_menu_a 0 0 [
                uispace $UIwindow_padding $UIwindow_padding [
                    uivlist 0.003 [
                        uitext "^f8Cube Craft Debug ^f7[F2]" 0.6
                        uiline $c_line
                        uitext (format "Absolute camera: X %1  Y %2  Z %3" (getdebugcamx) (getdebugcamy) (getdebugcamz)) 0.52
                        uitext (format "Camera chunk: X %1  Y %2" (getdebugchunkx) (getdebugchunky)) 0.52
                        uitext (format "Rendered chunks: %1 total  (%2 full, %3 LOD)" (+ (getdebugrenderedfull) (getdebugrenderedlod)) (getdebugrenderedfull) (getdebugrenderedlod)) 0.52
                        uitext (format "Chunk loading queue: %1" (getdebugloadingqueue)) 0.52
                        uitext (format "Chunk generation queue: %1" (getdebuggenerationqueue)) 0.52
                        uialign* -1 0
                    ]
                ]
                uioutline $c_line
                uiclamp- 1 1 1 1
            ]
        ]
    ]
]
