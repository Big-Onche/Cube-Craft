///////////////////////////////////////////////////////////////////////////////
//  Creative inventory                                                       //
///////////////////////////////////////////////////////////////////////////////

UImenu "creative_inventory" [
    uivlist 0.018 [
        uitext "Select a block or scatter object" 0.75
        uigrid 4 0.014 0.014 [
            loop i (creativeblockcount) [
                uivlist 0.006 [
                    if (< $i (creativecubecount)) [
                        uivslotview (creativeblockslot $i) 0.145 0.145 [
                            if (= $i (getcreativeblock)) [
                                uioutline 0xFFE7B94A
                                uiclamp- 1 1 1 1
                            ]
                            uihold [
                                uioutline 0xFFFFFFFF
                                uiclamp- 1 1 1 1
                            ] [
                                uihover [
                                    uioutline 0xFFC0C0C0
                                    uiclamp- 1 1 1 1
                                ]
                            ]
                            uirelease [
                                creativeselect $i
                                hideui "creative_inventory"
                            ]
                        ]
                    ] [
                        uimodelpreview (creativeblockmodel $i) "mapmodel" 0.145 0.145 [
                            if (= $i (getcreativeblock)) [
                                uioutline 0xFFE7B94A
                                uiclamp- 1 1 1 1
                            ]
                            uihold [
                                uioutline 0xFFFFFFFF
                                uiclamp- 1 1 1 1
                            ] [
                                uihover [
                                    uioutline 0xFFC0C0C0
                                    uiclamp- 1 1 1 1
                                ]
                            ]
                            uirelease [
                                creativeselect $i
                                hideui "creative_inventory"
                            ]
                        ]
                    ]
                    uifill 0.145 0.024 [
                        uitext (creativeblockname $i) 0.52
                    ]
                ]
            ]
        ]
        uitext "Left click: remove    Right click: place    Wheel / 1-8: select" 0.48
    ]
] [] [] [] "Creative Inventory"
