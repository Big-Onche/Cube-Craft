///////////////////////////////////////////////////////////////////////////////
//  Creative inventory and hotbar                                            //
///////////////////////////////////////////////////////////////////////////////

UI_creative_drag_item = -1
UI_creative_drag_slot = -1
UI_creative_drop_hotbar = 0

UI_creative_item_preview = [
    if (< $arg1 (creativecubecount)) [
        uivslotview (creativeblockslot $arg1) $arg2 $arg2 [
            doargs $arg3
        ]
    ] [
        // Geometry images follow worldmodelfilter, matching cube slots and
        // model skins while using the scatter logo/diffuse fallback.
        uiworldimage (creativeblockicon $arg1) $arg2 $arg2 [
            doargs $arg3
        ]
    ]
]

UI_creative_hotbar_slot = [
    local item
    item = (getcreativehotbarslot $arg1)
    uidragsource $arg2 $arg2 [
        uicolor 0xD0222222 $arg2 $arg2
        if (= $arg1 (getcreativehotbarselected)) [
            uioutline 0xFFE7B94A
        ] [
            uioutline 0xFF777777
        ]
        uiclamp* 1 1 1 1

        if (>= $item 0) [
            UI_creative_item_preview $item (*f $arg2 0.82) [
                uialign 0 0
            ]
        ]

        uifill $arg2 $arg2 [
            uialign -1 -1
            uispace 0.004 0.002 [
                uitext (+ $arg1 1) 0.40
            ]
        ]

        uipress [
            UI_creative_drop_hotbar = 0
            creativehotbarselect $arg1
            if (>= $item 0) [
                UI_creative_drag_item = $item
                UI_creative_drag_slot = $arg1
            ]
        ]
        uidrop [
            UI_creative_drop_hotbar = 1
            if (>= $UI_creative_drag_item 0) [
                if (!= $UI_creative_drag_slot $arg1) [
                    if (>= $UI_creative_drag_slot 0) [
                        creativehotbarswap $UI_creative_drag_slot $arg1
                    ] [
                        creativehotbarassign $arg1 $UI_creative_drag_item
                    ]
                    creativehotbarselect $arg1
                    UI_creative_drag_item = -1
                    UI_creative_drag_slot = -1
                ]
            ]
        ]
        uihold [
            uioutline 0xFFFFFFFF
            uiclamp- 1 1 1 1
        ]
        uihover [
            uioutline 0xFFC0C0C0
            uiclamp- 1 1 1 1
        ]
    ]
]

UI_creative_hotbar = [
    uihlist 0.005 [
        loop i 9 [
            UI_creative_hotbar_slot $i $arg1
        ]
    ]
]

newui "creative_hotbar" [
    uiallowinput (&& (creativeactive) (uivisible "creative_inventory"))
    uieschide 0
    if (|| $mainmenu $hidehud $editing (! (creativeactive))) [] [
        uialign 0 1
        uispace 0 0.018 [
            UI_creative_hotbar 0.064
        ]
    ]
]

newui "creative_drag_preview" [
    uiallowinput 0
    uieschide 0
    if (&& (uivisible "creative_inventory") (>= $UI_creative_drag_item 0)) [
        uialign -1 -1
        if (uidragreleased) [
            if (>=f (uidragreturnprogress 220) 1.0) [
                UI_creative_drag_item = -1
                UI_creative_drag_slot = -1
                uidragfinish
            ] [
                uioffset (-f (uidragreturnx 220) 0.029) (-f (uidragreturny 220) 0.029) [
                    UI_creative_item_preview $UI_creative_drag_item 0.058 [
                        uioutline 0xFFFFFFFF
                        uiclamp- 1 1 1 1
                    ]
                ]
            ]
        ] [
            uioffset (-f (uicursorx 0.029) 0.029) (-f (uicursory 0.029) 0.029) [
                UI_creative_item_preview $UI_creative_drag_item 0.058 [
                    uioutline 0xFFFFFFFF
                    uiclamp- 1 1 1 1
                ]
            ]
        ]
    ]
]

UImenu "creative_inventory" [
    if (! (creativeactive)) [
        hideui "creative_inventory"
        // Existing profiles may still bind I directly to this menu.
        if (survivalactive) [showui "survival_inventory"]
    ] [
        uivlist 0.018 [
            uitext "Creative inventory" 0.75
            uitext "Drag blocks and objects into one of the nine hotbar slots." 0.48
            uigrid 9 0.008 0.008 [
                loop i (creativeblockcount) [
                    uidragsource 0.072 0.090 [
                        uicolor 0xD0222222 0.072 0.090
                        uioutline 0xFF666666
                        uiclamp* 1 1 1 1
                        uialign 0 -1
                        UI_creative_item_preview $i 0.068 [
                            uialign 0 -1
                        ]
                        uifill 0.072 0.020 [
                            uialign 0 1
                            uitext (creativeblockname $i) 0.36
                        ]
                        uipress [
                            UI_creative_drop_hotbar = 0
                            UI_creative_drag_item = $i
                            UI_creative_drag_slot = -1
                        ]
                        uihold [
                            uioutline 0xFFFFFFFF
                            uiclamp- 1 1 1 1
                        ] [
                            uihover [
                                uioutline 0xFFC0C0C0
                                uiclamp- 1 1 1 1
                            ]
                        ]
                    ]
                ]
            ]
            uiline $c_line
            uitext "Hotbar" 0.55
            UI_creative_hotbar 0.064
            if (>= $UI_creative_drag_item 0) [
                uitext (concat "Dragging:" (creativeblockname $UI_creative_drag_item)) 0.44
            ] [
                uitext "Use 1-9 or the mouse wheel to select a slot." 0.44
            ]
            uidrop [
                if (&& (! $UI_creative_drop_hotbar) (>= $UI_creative_drag_slot 0)) [
                    creativehotbarassign $UI_creative_drag_slot -1
                    UI_creative_drag_item = -1
                    UI_creative_drag_slot = -1
                ]
                UI_creative_drop_hotbar = 0
            ]
        ]
    ]
] [
    UI_creative_drag_item = -1
    UI_creative_drag_slot = -1
    showui "creative_drag_preview"
] [
    UI_creative_drag_item = -1
    UI_creative_drag_slot = -1
    hideui "creative_drag_preview"
] [] "Inventory"
