// Procedural terrain generation and cube definitions.
//
// terraincube <name> <texture path> <texsize> [side cube]
//
// Texture paths are relative to media/texture. texsize is passed to texscale.
// The optional side cube makes it possible to use one texture on the top face
// and another cube's texture on the remaining faces.

terrainreset

// Noise frequencies are measured in inverse blocks. Lower values make larger
// features. The five layers use independent noise fields derived from worldseed.
terraincontinentfreq 0.0005
terrainmountainfreq  0.002
terrainerosionfreq   0.003
terrainhillfreq      0.01
terraindetailfreq    0.02

// Domain warping bends large features away from circular noise blobs. Continents
// use modest warping; mountains and erosion share the stronger feature warp so
// ranges and valleys curve together.
terraincontinentwarpfreq 0.001
terraincontinentwarpamp  40
terrainfeaturewarpfreq   0.001
terrainfeaturewarpamp    120

// Independent low-frequency climate maps. Weirdness bends temperature and
// moisture in opposite directions so unusual hot/dry and cold/wet regions form
// without synchronizing the underlying maps.
terraintemperaturefreq    0.0004
terrainmoisturefreq       0.0006
terrainweirdnessfreq      0.001
terrainweirdnessstrength  0.15
terrainmountainstonefreq  0.08

// Biome thresholds. terrainbiomeblend controls the transition width and texture
// patch scale in blocks; set it to 0 for hard biome borders.
terrainsnowheight         150
terrainmountainstonelow   75
terrainmountainstonehigh  125
terraindeserttemperature  0.4
terraindesertmoisture    -0.18
terrainforestmoisture     0.10
terrainbiomeblend         16

// Trees are considered independently for each grass column. Forests use the
// higher density; plains remain sparse. Above 25 blocks, regular trees
// progressively give way to pines until all eligible trees are pines at 40.
terrainforesttreedensity 0.05
terrainplainstreedensity 0.0015
terrainpinestartheight   50
terrainpinefullheight    100

// Two intersecting 3D fields form long connected cave veins. Their narrower
// surface width lets occasional veins emerge as entrances. Cheese pockets and
// large chambers are less frequent connectors; broad chambers become more
// common below terraincavedeepheight.
terraincavefreq                  0.05
terraincavethreshold             0.55
terrainlargecavefreq             0.02
terrainlargecavethreshold        0.72
terrainlargecavedeepthreshold    0.48
terraintunnelfreq                0.03
terraintunnelwidth               0.12
terraincaveentrancewidth         0.04
terraincavemindepth             -64
terraincavefulldepth             24
terraincavedeepheight           -64

// The lowest three block layers are always lava. Underground lava lakes begin
// rarely around -16, reach their shallow chance at -64, then become more
// frequent and grow toward their maximum size near the bottom of the world.
// Shape noise, unequal axes, and overlapping lobes prevent circular lakes.
terrainbottomlavalayers          3
terrainlavalakestartheight      -16
terrainlavalakedeepheight       -64
terrainlavalakeshallowchance     0.03
terrainlavalakedeepchance        0.33
terrainlavalakeminsize           6
terrainlavalakemaxsize           48
terrainlavalakespacing           24
terrainlavalakeshapefreq         0.08
terrainlavalakeshapevariation    0.35

// Sand follows the actual land/water boundary on both sides. Deep ocean floors
// remain dirt. Variation bends the nominal coast width using the biome blend
// noise, avoiding a perfectly uniform strip.
terraincoastwidth         9
terraincoastvariation     3
terrainbeachminheight    -2
terrainbeachmaxheight     1

// Heights are in blocks. Continental noise establishes oceans and land; hills
// only affect the land mask, while ridged mountains and erosion only affect the
// mountain mask. Detail adds small irregularities everywhere.
terrainsealevel        0
terraincontinentheight 20
terrainhillheight      10
terrainmountainheight  200
terrainerosionheight   15
terraindetailheight    2

// Noise values range from -1 to 1. Each mask fades smoothly from low to high.
terrainlandmasklow      -0.2
terrainlandmaskhigh      0.1
terrainmountainmasklow   0.15
terrainmountainmaskhigh  0.65

terraincube "Grass" "terrain/grass.png" 16 "Dirt"
terraincube "Dirt"  "terrain/dirt.png"  16
terraincube "Stone" "terrain/stone.png" 16
terraincube "Sand"  "terrain/sand.png"  16
terraincube "Snow"  "terrain/snow.png"  16
terraincube "Wood"  "terrain/wood.png"  16
terraincube "Leaves" "terrain/leafs.png" 16
